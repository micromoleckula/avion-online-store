<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avion - basket</title>
  </head>
  <body>
    <header id="header" class="header__hero"></header>
    <main>
      <section class="basket__section">
        <h1 class="basket__title">Your shopping cart</h1>
        <div id="basket-list" class="basket__list"></div>
        <p id="basket-empty" class="basket__empty" style="display: none">
          Shopping cart empty.
        </p>
        <div class="basket__footer">
          <p class="basket__total">Total: <span id="total-price">0 $</span></p>
          <button id="checkout-btn" class="basket__checkout">
            Place an order
          </button>
        </div>
      </section>

      <!-- Модальное окно -->
      <div id="order-modal" class="modal" style="display: none">
        <div class="modal__content">
          <h2 class="modal__title">Order placement</h2>
          <form id="order-form" class="modal__form">
            <label for="order-name" class="modal__label">Name:</label>
            <input type="text" id="order-name" class="modal__input" required />

            <label for="order-address" class="modal__label"
              >Delivery address:</label
            >
            <input
              type="text"
              id="order-address"
              class="modal__input"
              required
            />

            <button type="submit" class="modal__submit">Place an order</button>
          </form>
          <div id="order-success" class="modal__success" style="display: none">
            <p>Thank you for your purchase!</p>
            <button id="close-modal" class="modal__close">OK</button>
          </div>
        </div>
      </div>
    </main>
    <footer id="footer" class="footer__hero"></footer>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
