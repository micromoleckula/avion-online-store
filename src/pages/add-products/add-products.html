<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>add products</title>
  </head>
  <body>
    <header id="header" class="header__hero"></header>
    <main>
      
      <section class="add-product">
        <div class="container">
          <h2 class="add-product__title">Добавить товар</h2>
      
          <form id="productForm" class="add-product__form">
            <input class="add-product__input" type="text" name="title" placeholder="Название товара" required />
            <input class="add-product__input" type="number" name="price" placeholder="Цена" required />
            <textarea class="add-product__textarea" name="description" placeholder="Описание" required></textarea>
            <input class="add-product__file" type="file" name="image" accept="image/*" required />
            <button class="add-product__button" type="submit">Загрузить товар</button>
          </form>
      
          <div id="status" class="add-product__status"></div>
        </div>
      </section>

      
    </main>
    <footer id="footer" class="footer__hero"></footer>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
